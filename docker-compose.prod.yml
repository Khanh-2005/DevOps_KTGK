# Chạy trên VPS. File này được Jenkins copy sang server thành ~/ecommerce/docker-compose.yml
# Biến ${...} được đọc từ file .env nằm cạnh file này (do Jenkins đẩy lên)
# và từ biến môi trường DOCKERHUB_USER, IMAGE_TAG (do Jenkinsfile truyền vào).

services:
  db:
    image: mysql:8.4
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql          # dữ liệu DB nằm ngoài container -> deploy không mất data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # KHÔNG publish port 3306 -> DB chỉ app trong cùng network truy cập được

  app:
    image: docker.io/${DOCKERHUB_USER}/ecommerce-app:${IMAGE_TAG:-latest}
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy      # đợi MySQL sẵn sàng rồi mới chạy app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db                       # tên service = hostname trong network của compose
      DB_PORT: 3306
      DB_DIALECT: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "80:3000"                       # host(VPS):container
    volumes:
      - uploads:/app/public/uploads/products   # ảnh admin upload không mất khi deploy

volumes:
  db_data:
  uploads:
